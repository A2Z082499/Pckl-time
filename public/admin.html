<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pickle Time Admin</title>
<style>body{font:15px Inter,system-ui,sans-serif;margin:0;background:#f6f3ec;color:#14213d}main{max-width:760px;margin:0 auto;padding:24px 16px}
h1{font-size:1.4rem}input,button,select{font:inherit;padding:10px 12px;border:1.5px solid #d9dde5;border-radius:10px}
button{background:#ffb800;border-color:#e5a400;font-weight:700;cursor:pointer}button.x{background:#fff;border-color:#e0493f;color:#e0493f}
.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 6px 24px #0c1f3f1f}.row{display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 6px;border-bottom:1px solid #d9dde5}#msg{color:#e0493f;min-height:1.2em}
.blocked{background:#f1f2f5;color:#6b7589}</style></head><body><main>
<h1>Pickle Time admin</h1>
<div class="card" id="login"><div class="row"><input id="pw" type="password" placeholder="Admin password"><button id="go">Sign in</button></div></div>
<p id="msg" role="status"></p>
<div id="panel" hidden>
 <div class="card"><b>Block an hour</b> (maintenance, tournament)<div class="row" style="margin-top:10px"><input type="date" id="bd"><select id="bh"></select><button id="block">Block hour</button></div></div>
 <div class="card"><b>Upcoming bookings</b><table><thead><tr><th>Date</th><th>Time</th><th>Name</th><th>Phone</th><th>Ref</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script>
const $=id=>document.getElementById(id);let key=sessionStorage.getItem('k')||'';
const t=h=>`${(h+11)%12+1}${h<12?'AM':'PM'}`;
for(let h=6;h<22;h++)$('bh').add(new Option(t(h)+'–'+t(h+1),h));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(opt){const r=await fetch('/api/admin',{...opt,headers:{'x-admin-key':key,'Content-Type':'application/json'}});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
async function load(){try{const rows=await api({});$('login').hidden=true;$('panel').hidden=false;$('msg').textContent='';
 $('rows').innerHTML=rows.length?rows.map(r=>`<tr class="${r.status}"><td>${r.date}</td><td>${t(r.hour)}</td><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.ref)}</td><td><button class="x" data-d="${r.date}" data-h="${r.hour}">${r.status==='blocked'?'Unblock':'Cancel'}</button></td></tr>`).join(''):'<tr><td colspan="6">No upcoming bookings.</td></tr>'}
 catch(e){$('msg').textContent=e.message;$('login').hidden=false;$('panel').hidden=true}}
$('go').onclick=()=>{key=$('pw').value;sessionStorage.setItem('k',key);load()};
$('block').onclick=async()=>{try{await api({method:'POST',body:JSON.stringify({action:'block',date:$('bd').value,hour:+$('bh').value})});load()}catch(e){$('msg').textContent=e.message}};
$('rows').onclick=async e=>{const b=e.target.closest('button');if(!b||!confirm('Remove this hour? The slot becomes open again.'))return;
 await api({method:'POST',body:JSON.stringify({action:'cancel',date:b.dataset.d,hour:+b.dataset.h})});load()};
if(key)load();
</script></main></body></html>
